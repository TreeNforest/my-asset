name: 編譯並部署

on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 Babel
        run: npm install --no-save @babel/core@7.26.0 @babel/preset-react@7.26.3

      - name: 把 JSX 先編譯好（原本是在手機上即時編譯）
        run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
